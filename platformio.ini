[platformio]
default_envs = ai_voice
src_dir = src

[env:serial_printer]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.flash_freq = 80MHz

board_build.arduino.memory_type = dio_opi   ; 
board_build.psram_size = 8MB

build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

build_src_filter =
    +<serial_printer.cpp>

[env:ble_iprint]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.flash_freq = 80MHz
board_build.arduino.memory_type = dio_opi
board_build.psram_size = 8MB
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
build_src_filter =
    +<ble_print.cpp>

[env:ai_voice]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.flash_freq = 80MHz
board_build.arduino.memory_type = dio_opi
board_build.psram_size = 8MB
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
build_src_filter =
    +<ai_print.cpp>
    +<ai/*.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    olikraus/U8g2@^2.35.9
    tzapu/WiFiManager@^2.0.17
    bitbank2/JPEGDEC@^1.6.0   ; 文生图打印：JPEG 解码（支持灰度输出+缩放）

; ─────────────────────────────────────────────────────────────
; ★ UART 日志版（2026-10-10）：给"USB 没接 GPIO19/20、只引了
;   UART 转换芯片(TXD0=GPIO43)"的板子看串口日志用。
;   区别：Serial 走 UART0（只开 TX，不占 GPIO44——那是外设电源脚）。
;   USB 走原生 CDC 的板子（实战派/自家板 USB 直连 19/20）继续用 ai_voice。
[env:ai_voice_uart]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_size = 16MB
board_build.flash_mode = dio
board_build.flash_freq = 80MHz
board_build.arduino.memory_type = dio_opi
board_build.psram_size = 8MB
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSERIAL_VIA_UART=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
build_src_filter =
    +<ai_print.cpp>
    +<ai/*.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    olikraus/U8g2@^2.35.9
    tzapu/WiFiManager@^2.0.17
    bitbank2/JPEGDEC@^1.6.0
